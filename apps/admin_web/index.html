<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b3545" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cycle Clinic Admin</title>
    <script>
      // Apply the saved theme before the first paint (no flash of the wrong theme). Keep in step with src/utils/theme.ts.
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem('cm-admin-preferences') || '{}') || {}).theme;
          if (t !== 'dark' && t !== 'system') t = 'light';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
